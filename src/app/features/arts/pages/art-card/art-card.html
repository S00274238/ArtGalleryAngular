<a class="art-card" [routerLink]="['/arts', art()._id]">
  <div class="artwork">
    @if (art().imageUrl; as imageUrl) {
      <img [src]="imageUrl" alt="" loading="lazy" />
    } @else {
      <span>Image unavailable</span>
    }
  </div>
  <div class="caption">
    <h2>{{ art().name }}</h2>
    <p>{{ art().genre }} @if (art().year) { <span>· {{ art().year }}</span> }</p>
  </div>
</a>
