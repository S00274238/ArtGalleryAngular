<section class="gallery-heading">
  <div class="page"><h1>The Collection</h1></div>
</section>

<section class="page collection" aria-label="Artworks">
  @let s = state();
  @if (s.status === 'loading') {
    <p class="status" role="status">Loading artworks…</p>
  } @else if (s.status === 'error') {
    <p class="status error" role="alert">{{ s.message }}</p>
  } @else if (s.data.length === 0) {
    <p class="status">The collection is empty. Add an artwork to get started.</p>
  } @else {
    <div class="grid">
      @for (art of s.data; track art._id) {
        <app-art-card [art]="art" />
      }
    </div>
  }
</section>
